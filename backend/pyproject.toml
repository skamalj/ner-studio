[project]
name = "ner-studio-backend"
version = "0.1.0"
description = "LangGraph backend for document entity extraction and summarization"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0",
    "boto3>=1.35",
    "pypdf>=5.1",
    "tiktoken>=0.8",
    "langgraph>=0.2.50",
    "langchain-core>=0.3.20",
    "langchain-aws>=0.2.6",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.2.10",
    "langchain-google-genai>=2.0.5",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
